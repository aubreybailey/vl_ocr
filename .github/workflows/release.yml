name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No pinned flutter-version: llama_cpp_dart 0.9.0-dev requires Dart
      # SDK ^3.10.0, which is newer than 3.27.0's bundled 3.6.0 (found by
      # the first CI run failing here) -- track latest stable instead of
      # re-pinning to another version that'll go stale the same way.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # native assets (needed by llama_cpp_dart's prebuilt-.so bundling) are
      # still experimental as of the Flutter version pinned above; if this
      # step or the build fails, that's the flag most likely to need
      # adjusting.
      - run: flutter config --enable-native-assets

      # Regenerate the android/ platform folder fresh every build so we
      # don't have to hand-maintain Gradle/Kotlin boilerplate in git; this
      # only touches platform scaffolding, not lib/ or pubspec.yaml.
      - name: Ensure android/ platform folder exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name vl_ocr .
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename APK with tag
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/vl_ocr-${GITHUB_REF_NAME:-dev}.apk"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.apk
