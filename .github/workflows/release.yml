name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Default GITHUB_TOKEN is read-only on this repo/org, which made
# softprops/action-gh-release fail with 403 "Resource not accessible by
# integration" -- needs explicit contents:write to create the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No pinned flutter-version: llama_cpp_dart 0.9.0-dev requires Dart
      # SDK ^3.10.0, which is newer than 3.27.0's bundled 3.6.0 (found by
      # the first CI run failing here) -- track latest stable instead of
      # re-pinning to another version that'll go stale the same way.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # native assets (needed by llama_cpp_dart's prebuilt-.so bundling) are
      # still experimental as of the Flutter version pinned above; if this
      # step or the build fails, that's the flag most likely to need
      # adjusting.
      - run: flutter config --enable-native-assets

      # Regenerate the android/ platform folder fresh every build so we
      # don't have to hand-maintain Gradle/Kotlin boilerplate in git; this
      # only touches platform scaffolding, not lib/ or pubspec.yaml.
      - name: Ensure android/ platform folder exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name vl_ocr .
          fi

      # The generated template's default compileSdk/targetSdk (34, as of
      # Flutter 3.47.4's `flutter create`) is behind what plugins need --
      # flutter_plugin_android_lifecycle wanted 36 (file_picker's AAR
      # metadata check), receive_sharing_intent 1.9.0 wants 37 (found the
      # same way, one plugin at a time). `flutter.compileSdkVersion`/
      # `targetSdkVersion` are the template's own tracking variables, so
      # overriding the literal is the fix rather than something that'll go
      # stale on the next Flutter bump. AGP 9.1.0 (bundled with this
      # Flutter version) only *recommends* up to 36 for compileSdk, but
      # that's a warning, not a hard failure -- the actual build error was
      # the AAR metadata check demanding 37, which this silences.
      - name: Bump compileSdk/targetSdk past plugin requirements
        run: |
          # Flutter 3.47.4's template generates Kotlin DSL (build.gradle.kts),
          # not the older Groovy build.gradle -- found by CI failing to find
          # the file this step assumed. Handle whichever shows up.
          gradle_file=android/app/build.gradle
          [ -f "$gradle_file" ] || gradle_file=android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' "$gradle_file"
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 37/' "$gradle_file"

      # mobile_ocr downloads its PaddleOCR ONNX models over HTTPS on first
      # use; without this the app doesn't crash, it just fails every
      # detection with "SecurityException: Permission denied (missing
      # INTERNET permission?)" deep in okhttp -- caught via logcat, not a
      # build failure, so CI can't catch this one on its own.
      - name: Add INTERNET permission for mobile_ocr's model download
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' \
            android/app/src/main/AndroidManifest.xml

      # flutter_zxing's own AndroidManifest.xml declares no permissions at
      # all (checked directly) -- CAMERA is the consuming app's
      # responsibility, same as any other Flutter camera plugin.
      - name: Add CAMERA permission for barcode/QR scanning
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA"/>' \
            android/app/src/main/AndroidManifest.xml

      # receive_sharing_intent needs ACTION_SEND (single image) and
      # ACTION_SEND_MULTIPLE (several at once, e.g. multi-select in Gallery)
      # intent-filters to register vl_ocr as a Share-sheet target for both,
      # plus singleTask (per the package's own README) instead of Flutter's
      # default singleTop so a repeated share reuses the running activity
      # rather than stacking a new instance. Both filters are inserted in
      # one sed pass since the freshly-generated manifest only has a single
      # pre-existing </intent-filter> (the launcher one) to anchor on --
      # running this same match twice in separate steps would insert each
      # block after every filter already added by the previous step,
      # duplicating them.
      - name: Register as a Share-sheet target for images (single + multiple)
        run: |
          sed -i 's/android:launchMode="singleTop"/android:launchMode="singleTask"/' \
            android/app/src/main/AndroidManifest.xml
          sed -i '/<\/intent-filter>/a\
            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="image/*" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND_MULTIPLE" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="image/*" />\n            </intent-filter>' \
            android/app/src/main/AndroidManifest.xml

      # Untested theory: mtmd_tokenize's rc=2 reproduces identically for
      # two unrelated model architectures (Qwen2.5-VL, Gemma 3) inside this
      # app, while both work fine as a native CLI process outside any
      # Android app sandbox -- consistent with an Android per-process
      # memory ceiling, not a code bug. Flutter's default template never
      # sets largeHeap, so the app runs under the OS default heap limit
      # while loading multi-GB GGUFs + running a vision tower forward
      # pass. Cheap to test before committing to NDK-level instrumentation.
      - name: Request largeHeap (untested OOM theory for mtmd_tokenize rc=2)
        run: |
          sed -i '/<application$/a\        android:largeHeap="true"' \
            android/app/src/main/AndroidManifest.xml

      # After the INTERNET fix let mobile_ocr's ONNX Runtime actually run,
      # release builds crashed with "JNI DETECTED ERROR IN APPLICATION:
      # java_class == null in call to GetMethodID ... OrtSession.run" --
      # a SIGABRT tombstone, not a caught exception. This is documented
      # ONNX Runtime behavior under R8 (github.com/microsoft/onnxruntime
      # issue #17847): R8 strips the ai.onnxruntime.* Java classes that
      # the native library looks up via JNI reflection unless kept.
      - name: Keep ONNX Runtime classes from R8 (fixes native JNI crash)
        run: |
          echo '-keep class ai.onnxruntime.** { *; }' >> android/app/proguard-rules.pro
          gradle_file=android/app/build.gradle
          [ -f "$gradle_file" ] || gradle_file=android/app/build.gradle.kts
          sed -i '/signingConfig = signingConfigs.getByName("debug")/a\            isMinifyEnabled = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")' \
            "$gradle_file"

      - run: flutter pub get
      # llama_cpp_dart's .aar only ships arm64-v8a libs; building the other
      # ABIs just wastes time and prints "no libraries; won't contain
      # llama.cpp" warnings for targets we can't run on anyway.
      - run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK with tag
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/vl_ocr-${GITHUB_REF_NAME:-dev}.apk"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.apk
