name: vl_ocr
description: >
  PoC screenshot-to-text viewer using a local Qwen2.5-VL model via llama.cpp
  (llama_cpp_dart). No Google, no root, no cloud calls.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  llama_cpp_dart: 0.9.0-dev.12
  image_picker: ^1.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
