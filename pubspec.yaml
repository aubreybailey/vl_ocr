name: vl_ocr
description: >
  PoC screenshot-to-text viewer using a local Qwen2.5-VL model via llama.cpp
  (llama_cpp_dart). No Google, no root, no cloud calls.
publish_to: 'none'
version: 0.1.0

environment:
  # llama_cpp_dart 0.9.0-dev requires Dart ^3.10.0.
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  llama_cpp_dart: 0.9.0-dev.12
  image_picker: ^1.2.3
  file_picker: ^12.3.0
  # Registers vl_ocr as a Share-sheet target for images (ACTION_SEND,
  # image/*) so a screenshot can be shared straight in, matching the
  # original Lens/Translate-style workflow this was built for.
  receive_sharing_intent: ^1.9.0
  # Ente's on-device OCR plugin (PaddleOCR v5 via ONNX): the box-overlay,
  # tap/swipe-to-select UI we actually want, proven working already.
  # Not on pub.dev yet, hence the git dependency.
  mobile_ocr:
    git:
      url: https://github.com/ente-io/mobile_ocr
      path: .

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
